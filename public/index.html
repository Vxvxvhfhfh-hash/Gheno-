<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code WhatsApp Steampunk Bot</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: radial-gradient(circle at center, #1b2838 0%, #0f1c2e 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f0f0f0;
        text-align: center;
      }
      h1 {
        margin-bottom: 1rem;
        font-weight: 300;
      }
      img {
        max-width: 320px;
        border: 6px solid #cfa96e;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      }
      footer {
        position: absolute;
        bottom: 1rem;
        font-size: 0.8rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Scannez pour rejoindre notre monde steampunk ✨</h1>
    <img id="qr" alt="QR Code WhatsApp" />
    <footer>Déployé sur Vercel · Propulsé par WhatsApp Web.js & Gemini</footer>

    <script>
      const qrImg = document.getElementById("qr");
      const socket = io();
      socket.on("qr", (src) => {
        qrImg.src = src;
      });
      socket.on("ready", () => {
        document.querySelector("h1").textContent = "Bot connecté ! Vous pouvez fermer cette page.";
      });
    </script>
  </body>
</html>
