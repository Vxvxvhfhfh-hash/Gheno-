<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Steampunk IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>
    <style>
      :root {
        --accent: #cfa96e;
        --bg1: #1b2838;
        --bg2: #0f1c2e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at center, var(--bg1) 0%, var(--bg2) 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f0f0f0;
      }
      header {
        padding: 1rem;
        text-align: center;
        font-family: "UnifrakturCook", cursive;
        font-size: 2rem;
        color: var(--accent);
        letter-spacing: 2px;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
      }
      .msg {
        margin-bottom: 1.2rem;
        max-width: 80%;
        line-height: 1.4;
      }
      .mine {
        margin-left: auto;
        text-align: right;
      }
      .bubble {
        background: rgba(0, 0, 0, 0.4);
        padding: 0.8rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--accent);
        backdrop-filter: blur(6px);
      }
      img.preview {
        max-width: 200px;
        display: block;
        margin-top: 0.5rem;
        border: 3px solid var(--accent);
      }
      form {
        display: flex;
        padding: 1rem;
        gap: 0.5rem;
        background: #0d1724;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.7rem 1rem;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 1rem;
      }
      button {
        background: var(--accent);
        color: #0f1c2e;
        border: none;
        padding: 0 1.5rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>Salon Steampunk IA</header>
    <div id="chat"></div>
    <form id="promptForm">
      <input id="prompt" type="text" placeholder="Entrez votre requête…" autocomplete="off" required />
      <button type="submit">Envoyer</button>
    </form>

    <script>
      const chat = document.getElementById("chat");
      const promptForm = document.getElementById("promptForm");
      const promptInput = document.getElementById("prompt");
      const socket = io();

      function addMessage(author, text, image) {
        const div = document.createElement("div");
        div.className = "msg" + (author === "Moi" ? " mine" : "");
        div.innerHTML = `<div class="bubble"><strong>${author} :</strong><br>${text.replace(/\n/g, "<br>")}</div>`;
        if (image) {
          const img = document.createElement("img");
          img.className = "preview";
          img.src = image;
          div.appendChild(img);
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      socket.on("wa-message", (data) => {
        addMessage(data.from, data.body);
      });

      promptForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const prompt = promptInput.value.trim();
        if (!prompt) return;
        addMessage("Moi", prompt);
        promptInput.value = "";
        try {
          const res = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const json = await res.json();
          addMessage("Bot", json.text, json.image);
        } catch (err) {
          console.error(err);
          addMessage("Erreur", "Impossible d'obtenir la réponse…");
        }
      });
    </script>
  </body>
</html>
